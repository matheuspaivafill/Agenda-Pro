<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - Agenda Pro</title>
    <script src="config.js?v=3"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
    <div class="home-container">
        <h1 class="logo">Agenda <span>Pro</span></h1>
        <p class="subtitle">Crie uma nova senha</p>

        <form id="reset-form" style="margin-top: 28px; text-align: left;">
            <label style="display:block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Nova senha</label>
            <input type="password" id="new-password" class="input_field" placeholder="Mínimo 8 caracteres" required>
            <button type="submit" class="register-button" style="margin-top: 8px;">Redefinir senha</button>
        </form>

        <p style="margin-top: 20px; font-size: 14px; color: var(--muted);">
            <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">← Voltar para o login</a>
        </p>
    </div>

    <div id="toast"></div>
    <script src="toast.js?v=3"></script>
    <script>
        const params = new URLSearchParams(window.location.search)
        const token = params.get("token")

        document.getElementById("reset-form").addEventListener("submit", function(event) {
            event.preventDefault()

            if (!token) {
                showToast("Link inválido. Peça um novo link de recuperação.", true)
                return
            }

            const newPassword = document.getElementById("new-password").value

            fetch(`${API_URL}/reset-password`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, new_password: newPassword })
            })
            .then(async response => {
                const data = await response.json()
                if (!response.ok) throw new Error(data.detail || "Erro ao redefinir senha")
                return data
            })
            .then(data => {
                showToast(data.message)
                setTimeout(() => window.location.href = "login.html", 1500)
            })
            .catch(error => showToast(error.message, true))
        })
    </script>
</body>
</html>
