<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Agenda Pro</title>
    <script src="config.js?v=3"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
    <div class="home-container">
        <h1 class="logo">Agenda <span>Pro</span></h1>
        <p class="subtitle">Cadastre o seu estabelecimento</p>

        <form id="register-form" style="margin-top: 28px; text-align: left;">
            <label style="display:block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Nome do Estabelecimento</label>
            <input type="text" id="reg-name" class="input_field" placeholder="Ex: Barbearia Silva" required>

            <label style="display:block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Link Personalizado (Slug)</label>
            <input type="text" id="reg-slug" class="input_field" placeholder="Ex: barbearia-silva" required>

            <label style="display:block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">E-mail</label>
            <input type="email" id="reg-email" class="input_field" placeholder="seu@email.com" required>

            <label style="display:block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Senha</label>
            <input type="password" id="reg-password" class="input_field" placeholder="••••••••" required>

            <button type="submit" class="register-button" style="margin-top: 8px;">Criar Conta</button>
        </form>

        <p style="margin-top: 20px; font-size: 14px; color: var(--muted);">
            Já tem conta? <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Faça login</a>
        </p>
    </div>

    <div id="toast"></div>
    <script src="toast.js?v=3"></script>
    <script src="register.js?v=3"></script>
</body>
</html>
