<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Agenda Pro</title>
    <script src="config.js?v=3"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
    <div class="home-container">
        <h1 class="logo">Agenda <span>Pro</span></h1>
        <p class="subtitle">Vamos te ajudar a recuperar o acesso</p>

        <form id="forgot-form" style="margin-top: 28px; text-align: left;">
            <label style="display:block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">E-mail cadastrado</label>
            <input type="email" id="forgot-email" class="input_field" placeholder="seu@email.com" required>
            <button type="submit" class="register-button" style="margin-top: 8px;">Enviar link de recuperação</button>
        </form>

        <p style="margin-top: 20px; font-size: 14px; color: var(--muted);">
            <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">← Voltar para o login</a>
        </p>
    </div>

    <div id="toast"></div>
    <script src="toast.js?v=3"></script>
    <script>
        document.getElementById("forgot-form").addEventListener("submit", function(event) {
            event.preventDefault()
            const email = document.getElementById("forgot-email").value.trim()

            fetch(`${API_URL}/forgot-password`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            })
            .then(async response => {
                const data = await response.json()
                if (!response.ok) throw new Error(data.detail || "Erro ao processar pedido")
                return data
            })
            .then(data => {
                showToast(data.message)
                document.getElementById("forgot-email").value = ""
            })
            .catch(error => showToast(error.message, true))
        })
    </script>
</body>
</html>
